name: Vulnerability Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vulnerability check
        run: make vuln-check
